name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install JS deps
        run: npm ci

      - name: Install Python MCP deps
        working-directory: backend
        run: uv sync --extra dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # MCP health/integration spawns local Python; no external keys required.
          COPILOTKIT_TELEMETRY_DISABLED: "true"
