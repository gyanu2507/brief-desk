[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brief-desk-mcp"
version = "0.9.0"
description = "Python MCP backend for brief-desk (GitHub, trending, search, URLs, web, corpus)."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<3",
  "uvicorn[standard]>=0.32,<1",
  "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
brief-desk-mcp = "brief_desk_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:randomly"
